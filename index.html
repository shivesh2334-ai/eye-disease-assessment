<h1>Eye Disease Assessment</h1>
<p class="sub">Based on Harrison’s Principles of Internal Medicine, Ch. 32 · Disorders of the Eye (Horton)</p>
<nav id="nav"></nav><div id="v"></div>
<p class="foot">Educational decision-support aid built from one textbook chapter. It suggests possibilities and does not replace examination or clinical judgment.</p>
<script>
const CH=[["rd","Red eye"],["pn","Eye pain"],["ph","Photophobia"],["dc","Discharge"],["svl","Sudden painless loss"],["tml","Transient one-eye loss"],["flt","Floaters/flashes"],["crt","Curtain/shadow"],["dip","Double vision"],["ptz","Ptosis"],["dil","Dilated pupil"],["mio","Small pupil"],["prp","Proptosis"],["hdc","Headache"],["gca","Age >50, jaw/scalp pain"],["cgl","Gradual central loss"],["dst","Distortion"],["nb","Night blindness"],["per","Peripheral field loss"],["hal","Halos/nausea"],["bil","Both eyes"],["yw","Young woman"],["dm","Diabetes"],["htn","Hypertension"],["pem","Pain on eye movement"],["hem","Hemifield loss"],["btm","Bitemporal loss"]];
// name, category, tags, keywords, pathophysiology, diagnosis, treatment, pearl (no name), figure key, urgent
const C=[
["Conjunctivitis (viral/bacterial)","Red eye","rd dc","irritated watery foreign body mucopurulent adenovirus","Adenovirus is the commonest viral cause; bacterial infection gives mucopurulent exudate.","Clinical. Smears/cultures for severe, resistant or recurrent cases.","Mild: empiric broad-spectrum drops (sulfacetamide 10%, polymyxin-bacitracin, trimethoprim-polymyxin). Frequent handwashing, no touching eyes.","Most common cause of a red eye; pain is minimal and acuity only slightly reduced.","","0"],
["Allergic conjunctivitis","Red eye","rd","itching itch epiphora cobblestone atopic asthma contact lens","Immune-mediated; giant cobblestone papillae on the palpebral conjunctiva.","Clinical: itching, redness, tearing.","Cold compresses, topical vasoconstrictors, antihistamines (olopatadine), mast-cell stabilizers (cromolyn). Topical steroids work but risk glaucoma, cataract, infection; NSAIDs (ketorolac) better.","Itching is the typical symptom and it is often mistaken for infection.","","0"],
["Bacterial/fungal keratitis","Red eye","rd pn ph dc svl","contact lens corneal ulcer hypopyon vegetable trauma acanthamoeba","Infection of the cornea with ulceration, risking clouding, scarring, perforation. Fungal after plant material in warm climates; Acanthamoeba with poorly disinfected lenses.","Slit lamp: epithelial defect, cloudy stromal infiltrate, anterior chamber reaction, ± hypopyon. Scrape for Gram, Giemsa, KOH, culture.","Start empiric fortified topical antibiotics immediately after scrapings; subconjunctival antibiotics as needed. Consider fungus. No contact lenses.","Pain, photophobia and reduced vision distinguish it from simple conjunctivitis.","","1"],
["Herpes simplex keratitis","Red eye","rd pn ph","dendritic ulcer unilateral follicular blepharoconjunctivitis vesicles","Reactivation of latent HSV; stromal inflammation causes edema, vascularization, iridocyclitis.","Dendritic corneal epithelial ulcer on fluorescein staining (pathognomonic but often absent).","Cycloplegia plus topical antiviral (trifluridine, ganciclovir) or oral acyclovir/valacyclovir. Steroids only for stromal damage (risk melting, perforation, glaucoma).","Bilateral disease is extremely rare.","","1"],
["Herpes zoster ophthalmicus","Red eye","rd pn ph","vesicular rash forehead nose hutchinson shingles trigeminal V1","Varicella reactivation in V1; nasociliary involvement (vesicles on the nose) predicts eye disease.","Clinical: dermatomal vesicular rash; corneal dendrites, stromal keratitis, uveitis, raised IOP.","Antivirals plus cycloplegics; glucocorticoids in severe cases. Vaccinate healthy adults ≥50.","Nose-tip vesicles (Hutchinson sign) signal eye involvement.","","1"],
["Acute angle-closure glaucoma","Red eye","rd pn hal hdc dil","nausea vomiting asian hyperopia mid-dilated cloudy cornea blurred","Shallow anterior chamber; mid-dilated pupil lets peripheral iris block aqueous outflow so IOP rises abruptly.","Measure IOP during attack; gonioscopy shows narrow angle.","Acetazolamide (PO/IV), topical beta blockers, prostaglandin analogues, α2 agonists, pilocarpine; laser peripheral iridotomy if medical therapy fails.","Often misdiagnosed as abdominal or neurologic disease because of nausea and headache.","","1"],
["Anterior uveitis (iritis)","Red eye","rd pn ph","sarcoidosis ankylosing spondylitis arthritis behcet inflammatory bowel synechiae","Inflammation of iris/ciliary body, linked to HLA-B27 diseases, sarcoid, herpes, TB, syphilis; often idiopathic.","Slit lamp: cells floating in aqueous, keratic precipitates. Labs only for recurrent/severe.","Judicious topical glucocorticoids; pupil dilation reduces pain and prevents synechiae.","Slit-lamp cells in the aqueous make the diagnosis.","","0"],
["Posterior uveitis","Red eye","flt","floaters blurred vision toxoplasmosis cmv histoplasmosis behcet vitreous","Inflammation of vitreous, retina or choroid; more often systemic (sarcoid, Behçet, VKH, IBD) or infectious (toxoplasma, CMV, TB, syphilis).","Fundus examination.","Glucocorticoids for non-infectious disease; TNF-α inhibitors (adalimumab) in chronic uveitis; treat infection.","More likely than anterior uveitis to have an identifiable systemic cause.","","0"],
["Corneal abrasion","Red eye","pn rd ph","trauma foreign body scratch fluorescein contact lens tearing","Loss of corneal epithelium exposing basement membrane.","Fluorescein with cobalt-blue light: yellow staining. Evert upper lid to find foreign body.","Remove foreign body or irrigate; antibiotic ointment ± patch; cycloplegic drop (cyclopentolate 1%) for pain. Re-examine next day.","Topical anesthetic can reveal the diagnosis but is not given for home use.","","0"],
["Episcleritis / Scleritis","Red eye","rd pn","autoimmune rheumatoid lupus granulomatosis violet","Episcleral or scleral inflammation, scleritis often tied to connective tissue or vasculitic disease.","Clinical; scleritis: violet hue, severe pain; posterior form may show proptosis or choroidal effusion.","NSAIDs; topical or systemic glucocorticoids if they fail, especially with active autoimmune disease.","Discharge is absent, unlike conjunctivitis.","","0"],
["Endophthalmitis","Red eye","pn rd svl","surgery glaucoma filtering iv catheter immunosuppressed hypopyon candidemia","Bacterial, viral, fungal or parasitic infection of internal eye, from surgery, trauma or hematogenous seeding.","Clinical; vitreous sampling; look for occult foreign body or bacteremia.","Urgent ophthalmology; intraocular and systemic antimicrobials.","Visual loss may be the only symptom.","","1"],
["Subconjunctival hemorrhage","Red eye","rd","painless blood cough rubbing trauma bleeding disorder","Rupture of small vessels in the potential space between episclera and conjunctiva.","Clinical; visual acuity normal.","None; resolves spontaneously. Consider bleeding disorder if recurrent.","Spectacular but harmless.","","0"],
["Dry eye (keratoconjunctivitis sicca)","Red eye","rd","burning foreign body gritty sjogren sarcoidosis anticholinergic antihistamine","Reduced lacrimal secretion (drugs, Sjögren, sarcoid, radiation, cranial nerve V/VII lesions).","Schirmer strip wetting.","Frequent artificial tears and lubricants; punctal plugging or cautery in severe cases.","Corneal anesthesia is dangerous because there is no protective blink.","","0"],
["Blepharitis / hordeolum / chalazion","Red eye","rd","eyelid crusted greasy scaling stye lump rosacea seborrheic","Lid margin inflammation (staphylococci, rosacea, seborrhea); chalazion is chronic meibomian granuloma.","Clinical lid examination.","Lid hygiene, warm compresses, baby-shampoo scrubs; topical bacitracin/polymyxin; systemic tetracyclines if severe. Chalazion: incision or steroid injection.","Nonhealing ulcerative lid lesion: think basal/squamous cell or meibomian carcinoma.","","0"],
["Amaurosis fugax","Sudden loss","tml","curtain descending seconds minutes embolus carotid transient monocular","Transient retinal ischemia, usually from a Hollenhorst embolus (carotid, aorta, heart).","Fundoscopy, carotid and cardiac evaluation.","Treat the embolic source and vascular risk factors.","A curtain falling over one eye; flow resumes within minutes.","","1"],
["Central retinal artery occlusion","Sudden loss","svl","cherry-red fovea milky retina embolus afib counting fingers carotid","Arrest of retinal blood flow; emboli from carotid, aorta or heart.","Fundus: milky retina, cherry-red fovea, narrowed arterioles.","Emergency; search for embolic source (carotid, heart) and treat vascular risk factors; check ESR for giant cell arteritis.","Cherry-red fovea on a pale retina.","cherry","1"],
["Central retinal vein occlusion","Sudden loss","svl htn dm","blood and thunder hemorrhage polycythemia glaucoma hypercoagulable","Venous obstruction causes engorged veins, hemorrhages, ischemia.","Fundus: diffuse retinal hemorrhages with engorged tortuous veins.","Correct hypertension, diabetes, hypercoagulability; aspirin may help.","Fundus described as blood and thunder.","crvo","0"],
["Anterior ischemic optic neuropathy","Sudden loss","svl gca htn dm","disc swelling splinter hemorrhage altitudinal temporal arteritis ESR","Insufficient flow through posterior ciliary arteries; nonarteritic form linked to crowded disc; arteritic form to giant cell arteritis.","Edematous disc with splinter hemorrhages; check ESR/CRP; temporal artery biopsy (≥3 cm) if arteritic suspected.","Arteritic: high-dose glucocorticoids immediately, do not wait for biopsy (tocilizumab alternative). Nonarteritic: none.","Painless, sudden monocular loss; protect the other eye.","aion","1"],
["Optic neuritis","Sudden loss","svl pem yw","demyelination multiple sclerosis pain eye movements color desaturation retrobulbar","Inflammatory demyelination of the optic nerve; 15-year risk of MS about 50%.","Fundus often normal (retrobulbar); MRI brain for plaques; AQP4 and MOG antibodies for NMO.","IV methylprednisolone 250 mg q6h × 3 d then oral prednisone speeds recovery; MRI plaques ≥2: consider MS therapy.","Doctor sees nothing, patient sees nothing.","normal","0"],
["Retinal detachment","Sudden loss","flt crt svl","flashes floaters curtain myopia trauma cataract surgery scotoma","Retinal tear lets liquefied vitreous enter subretinal space; vitreous traction.","Dilated fundus examination.","Laser for tears; surgical repair of detachment.","Floaters, flashes, then a shadow in the peripheral field.","rd","1"],
["Vitreous degeneration / detachment","Sudden loss","flt","floaters flashes photopsia elderly hemorrhage","Age-related vitreous liquefaction; traction on retina causes photopsia.","Careful dilated exam for tear or hole.","Usually none; laser for tears; vitrectomy for persistent vitreous hemorrhage.","Unilateral brief flashes, versus bilateral prolonged migraine scintillations.","","0"],
["Migraine with visual aura","Sudden loss","hem hdc bil","fortification spectra scintillating zigzag 20 minutes aura","Spreading cortical phenomenon; scintillating scotoma expanding to periphery.","Clinical: stereotyped attacks, headache follows.","Treat migraine.","Visible with eyes closed; lasts longer than amaurosis fugax.","","0"],
["Occipital stroke / TIA","Sudden loss","hem svl","homonymous hemianopia macular sparing posterior cerebral vertebrobasilar","Occlusion of posterior cerebral artery supplying the occipital lobe.","Homonymous hemianopia stopping at the vertical meridian; MRI/CT; vascular imaging.","Acute stroke care; secondary prevention. Vision restoration therapy not proven.","Macular sparing is common.","homR","1"],
["Papilledema","Optic nerve","hdc bil","visual obscurations transient pseudotumor cerebri obese woman tetracycline mass","Optic disc swelling from raised intracranial pressure.","Neuroimaging; MR venography if needed; lumbar puncture opening pressure in lateral decubitus.","Acetazolamide, weight loss, bariatric surgery; shunt/stent or optic nerve sheath fenestration for progressive loss.","Visual acuity spared until late, with enlarged blind spot.","papil","1"],
["Leber’s / toxic optic neuropathy","Optic nerve","bil cgl","young men methanol ethambutol antifreeze cecocentral scotoma vitamin B12 mitochondrial","LHON: mitochondrial mutations (codon 11778); toxic or nutritional damage to optic nerves.","Bilateral cecocentral scotomas, optic pallor; check thiamine, B12, folate; drug/toxin history.","Remove offending agent; correct deficiencies; supportive.","Always check B12, folate and thiamine in unexplained bilateral central scotomas.","atrophy","0"],
["Optic disc drusen","Optic nerve","per","pseudopapilledema calcified incidental arcuate northern european","Calcified deposits within the optic nerve head.","B-scan ultrasound, CT or OCT (hyperechoic).","No treatment.","Mimics papilledema without raised pressure.","","0"],
["Cataract","Chronic loss","cgl","lens cloudy glare aging diabetes steroid uveitis red reflex","Lens opacification from aging, uveitis, diabetes, trauma, steroids, radiation.","Impaired red reflex; slit lamp.","Surgical extraction with intraocular lens; >95% improve.","Posterior subcapsular cataracts are typical with steroids.","","0"],
["Open-angle glaucoma","Chronic loss","per","cupping intraocular pressure african descent myopia arcuate scotoma insidious","Progressive optic neuropathy; axons at the superotemporal and inferotemporal disc poles die first.","Cup-to-disc ratio, serial IOP, OCT, computerized visual fields (arcuate/nasal step).","Topical beta blockers, prostaglandin analogues, adrenergic/cholinergic agents, carbonic anhydrase inhibitors; laser trabeculoplasty; trabeculectomy or drainage device.","Foveal acuity is spared until end stage.","glauc","0"],
["Age-related macular degeneration","Chronic loss","cgl dst","drusen metamorphopsia elderly central vision neovascular","Dry: drusen and RPE atrophy; wet: choroidal neovascular membrane leaks and bleeds.","Fundus, OCT, fluorescein angiography.","Wet: intravitreal anti-VEGF (bevacizumab, ranibizumab, aflibercept) monthly. Dry: vitamins C, E, β-carotene, zinc may slow progression.","Distortion of straight lines is the early wet symptom.","drusen","0"],
["Diabetic retinopathy","Chronic loss","dm cgl svl","neovascularization vitreous hemorrhage macular edema laser","Microvascular ischemia leading to neovascular vessels, hemorrhage, traction.","Dilated fundus examination; surveillance in all diabetics.","Panretinal photocoagulation at appropriate stage; anti-VEGF injections; control glucose and BP.","Leading cause of blindness; appears in nearly all long-standing diabetics.","dr","0"],
["Retinitis pigmentosa","Chronic loss","nb per","night blindness bone spicules tunnel vision electroretinogram","Rod-cone dystrophy; genetic mutations (rhodopsin, peripherin).","Fundus bone spicules; ring scotoma; abnormal ERG.","Vitamin A 15,000 IU/d slows ERG decline; gene therapy for RPE65 disease.","Avoid chloroquine, phenothiazines toxic retinopathy mimic.","rp","0"],
["Central serous chorioretinopathy","Chronic loss","dst","male 20-50 metamorphopsia blurred macula","Serous fluid leak from choroid detaches the neurosensory retina.","OCT shows subretinal fluid; fluorescein angiography.","Often spontaneous resolution; laser photocoagulation in some.","Recurrences are common.","","0"],
["Choroidal melanoma","Chronic loss","flt per","dark mass photopsia scotoma light skin blue eyes liver metastasis","Most common primary intraocular tumor; GNAQ/GNA11 mutations.","Fundus, ultrasound, OCT; serial growth.","Radiation; enucleation for large tumors.","About half metastasize, mainly to liver.","mel","0"],
["Chiasmal lesion (pituitary adenoma)","Neuro-ophthalmic","btm hem hdc","pituitary craniopharyngioma meningioma temporal field apoplexy","Compression of crossing nasal fibers at the chiasm.","Formal visual fields; MRI sella.","Treat the mass; urgent decompression if apoplexy.","Patients often don’t notice bitemporal loss; test each eye separately.","bitemp","0"],
["Oculomotor nerve palsy","Neuro-ophthalmic","dip ptz dil","down and out pupil aneurysm posterior communicating diabetes pupil-sparing","Third nerve injury: aneurysm, compression, ischemia. Pupil-sparing palsy suggests microvascular infarct.","Pupil involvement → CT/MR angiography urgently; pupil-sparing: risk factor review.","Compressive: urgent neurosurgery/neuroradiology. Microvascular: observe, resolves in months.","Dilated pupil plus painful palsy = aneurysm until proven otherwise.","","1"],
["Trochlear nerve palsy","Neuro-ophthalmic","dip","vertical diplopia head tilt reading downgaze closed head trauma","Superior oblique weakness, hypertropia and excyclotorsion.","Head tilt test; old photographs.","Prism; observe (microvascular); surgery if persistent.","Head tilt away from the lesion relieves diplopia.","","0"],
["Abducens nerve palsy","Neuro-ophthalmic","dip hdc","horizontal diplopia lateral rectus raised intracranial pressure false localizing","Sixth nerve injury, often microvascular; classic sign of raised intracranial pressure.","Cover test; fundus for papilledema; imaging if atypical.","Treat cause; patch or prism; surgery if persistent.","Diplopia worse looking toward the affected side.","","0"],
["Internuclear ophthalmoplegia","Neuro-ophthalmic","dip","adduction failure multiple sclerosis nystagmus abducting eye medial longitudinal fasciculus","MLF lesion between abducens and contralateral oculomotor nuclei.","Failure of adduction on lateral gaze with nystagmus of abducting eye; MRI.","Treat cause (MS is commonest).","Convergence usually preserved.","","0"],
["Myasthenia gravis (ocular)","Neuro-ophthalmic","dip ptz","fatigable fluctuating pupils normal variable ice test","Autoantibody-mediated neuromuscular transmission failure.","Fatigable ptosis, variable diplopia, normal pupils; AChR/MuSK antibodies often negative in ocular form.","Cholinesterase inhibitors, immunosuppression.","Pupils are always normal.","","0"],
["Horner syndrome","Neuro-ophthalmic","ptz mio","anhidrosis miosis apraclonidine carotid dissection","Sympathetic paresis to the eye.","Anisocoria worse in dim light; 1% apraclonidine dilates the miotic pupil.","Find cause: carotid dissection, brainstem stroke, neoplasm.","Triad: miosis, ptosis, anhidrosis.","","0"],
["Adie tonic pupil","Neuro-ophthalmic","dil","tonic pupil light-near dissociation dilute pilocarpine young women","Ciliary ganglion damage with denervation hypersensitivity.","0.125% pilocarpine constricts the tonic pupil but not normal pupil.","Reassurance; benign.","Slow redilation after near effort.","","0"],
["Graves’ ophthalmopathy","Orbit","prp dip","lid retraction lid lag thyroid exophthalmos extraocular muscle","Orbital inflammation and extraocular muscle enlargement.","Clinical; TSI; CT/MR show enlarged muscles with tendon sparing.","Lubricants; prednisone 60 mg/d then taper; teprotumumab; orbital decompression for severe disease.","Leading cause of adult proptosis.","","0"],
["Orbital cellulitis","Orbit","prp pn rd pem","fever sinusitis restricted motility chemosis","Spread from paranasal sinuses through the lamina papyracea.","CT orbits with contrast; blood cultures.","Early aggressive IV broad-spectrum antibiotics covering MRSA; surgical drainage if optic nerve dysfunction.","Risk of blindness, cavernous sinus thrombosis, meningitis.","","1"],
["Orbital pseudotumor","Orbit","prp pn pem","idiopathic painful myositis tendon involvement tolosa-hunt","Idiopathic inflammatory orbital syndrome.","Imaging: swollen muscles including tendons; dramatic steroid response.","Systemic glucocorticoids.","Pain is prominent, unlike Graves’.","","0"],
["Carotid-cavernous fistula","Orbit","prp rd dip","corkscrew vessels bruit pulsation trauma","Abnormal arteriovenous shunt draining through the orbit.","Imaging; enlarged superior ophthalmic vein; bruit.","Intravascular embolization.","Often mistaken for thyroid eye disease.","","0"]];
const LS=[["Optic nerve","Monocular central or arcuate scotoma, afferent pupil defect"],["Chiasm","Bitemporal hemianopia; junctional scotoma if anterior"],["Optic tract / LGB","Incongruous homonymous hemianopia"],["Temporal radiations (Meyer loop)","Superior quadrantanopia"],["Parietal radiations","Inferior quadrantanopia"],["Occipital cortex","Congruous homonymous hemianopia, macular sparing"],["Both occipital lobes","Cortical blindness with normal pupils and fundi"]];
let id=0;
function fld(a,b){let e=(s,l)=>{let c="c"+id++;return`<svg viewBox="0 0 80 92" width="64"><defs><clipPath id="${c}"><circle cx="40" cy="40" r="36"/></clipPath></defs><circle cx="40" cy="40" r="36" fill="var(--sf)" stroke="var(--tx)" stroke-width="2"/><g clip-path="url(#${c})" fill="var(--tx)">${s.map(r=>`<rect x="${r[0]}" y="${r[1]}" width="${r[2]}" height="${r[3]}"/>`).join("")}</g><text x="40" y="89" text-anchor="middle" font-size="9" fill="currentColor">${l}</text></svg>`};return e(a,"Left")+e(b,"Right")}

const FU={normal:["Normal / retrobulbar neuritis","Fig 32-10",""],cherry:["Central retinal artery occlusion","Fig 32-6",'<circle cx="34" cy="41" r="11" fill="#f3e8da" opacity=".85"/><circle cx="34" cy="41" r="3" fill="#b00"/>'],crvo:["Central retinal vein occlusion","Fig 32-8",[...Array(14)].map((_,i)=>`<circle cx="${18+(i*37)%46}" cy="${18+(i*23)%46}" r="4" fill="#7a0c0c" opacity=".7"/>`).join("")],aion:["Anterior ischemic optic neuropathy","Fig 32-9",'<circle cx="58" cy="40" r="10" fill="#f3d9a0"/><path d="M50 32l4 4M62 30l-3 5M66 46l-5-2" stroke="#800" stroke-width="2"/>'],papil:["Papilledema","Fig 32-12",'<circle cx="58" cy="40" r="11" fill="#f0b25f"/><path d="M48 36l5 2M66 34l-4 3M60 52l1-5" stroke="#800" stroke-width="2"/>'],atrophy:["Optic atrophy","Fig 32-11",'<circle cx="58" cy="40" r="8" fill="#fffbe8"/>'],rd:["Retinal detachment","Fig 32-14",'<path d="M4 54Q40 38 76 56L70 70Q40 80 12 68Z" fill="#8a8a78" opacity=".9"/>'],glauc:["Glaucomatous cupping","Fig 32-15",'<circle cx="58" cy="40" r="12" fill="#f4e0b8"/><circle cx="58" cy="40" r="9" fill="#fffaf0"/>'],drusen:["Age-related macular degeneration","Fig 32-16",[...Array(9)].map((_,i)=>`<circle cx="${26+(i*7)%18}" cy="${34+(i*5)%16}" r="1.8" fill="#f6e07c"/>`).join("")+'<ellipse cx="42" cy="46" rx="5" ry="3" fill="#8b0000"/>'],dr:["Proliferative diabetic retinopathy","Fig 32-17",'<path d="M58 40l-8 14M58 40l8 16" stroke="#600" stroke-width="1.5"/><circle cx="36" cy="54" r="4" fill="#7a0c0c"/><circle cx="26" cy="36" r="3" fill="#7a0c0c"/><circle cx="42" cy="30" r="2" fill="#f6e07c"/><circle cx="30" cy="46" r="2" fill="#f6e07c"/>'],rp:["Retinitis pigmentosa","Fig 32-18",[...Array(16)].map((_,i)=>`<path d="M${10+(i*17)%58} ${12+(i*29)%58}l4 3" stroke="#111" stroke-width="2"/>`).join("")],mel:["Choroidal melanoma","Fig 32-19",'<ellipse cx="26" cy="58" rx="9" ry="6" fill="#3a2a1a"/>']};
function fu(k){return`<svg viewBox="0 0 80 80" width="96"><circle cx="40" cy="40" r="38" fill="#cf5f2b"/><path d="M58 40C48 30 38 22 28 14M58 40C48 50 40 60 30 68M58 40C46 38 34 36 20 40" stroke="#8a1c0c" stroke-width="1.6" fill="none"/><circle cx="58" cy="40" r="6" fill="#f6d9a0"/><circle cx="34" cy="41" r="2.5" fill="#a84217"/>${FU[k][2]}</svg>`}
const $=s=>document.getElementById(s);let tab="assess",sel=new Set(),qs={n:0,s:0,q:null},fl="All";
const T=[["assess","Assess"],["cond","Conditions"],["learn","Learn"],["img","Image bank"]];
function nav(){$("nav").innerHTML=T.map(t=>`<button class="${t[0]==tab?"on":""}" onclick="tab='${t[0]}';show()">${t[1]}</button>`).join("")}
function det(c,extra){const f=c[8]&&FU[c[8]]?`<div style="float:right;margin-left:8px">${fu(c[8])}</div>`:c[8]&&FD[c[8]]?`<div style="float:right;margin-left:8px">${FD[c[8]][3]}</div>`:"";return`<details><summary>${c[0]}${c[9]=="1"?'<span class="tag">urgent</span>':""}<small>${c[1]}</small>${extra||""}</summary>${f}<div class="k">Pathophysiology</div><p>${c[4]}</p><div class="k">Diagnosis</div><p>${c[5]}</p><div class="k">Treatment</div><p>${c[6]}</p><div class="k">Pearl</div><p>${c[7]}</p><div style="clear:both"></div></details>`}
function assess(){const t=($("tx")?$("tx").value:"").toLowerCase();const w=t.split(/[^a-z0-9-]+/).filter(x=>x.length>3);
const r=C.map(c=>{let s=0;c[2].split(" ").forEach(g=>{if(sel.has(g))s+=3});const hay=(c[0]+" "+c[3]).toLowerCase();w.forEach(x=>{if(hay.includes(x))s+=2});return[s,c]}).filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0]).slice(0,7);
const mx=r.length?r[0][0]:1;let h=r.some(x=>x[1][9]=="1"&&x[0]>=mx*.6)?'<div class="urg">Some leading possibilities are sight- or life-threatening. Same-day ophthalmic or neurologic evaluation is advised.</div>':"";
$("res").innerHTML=r.length?h+r.map(x=>det(x[1],`<div class="bar"><i style="width:${Math.round(x[0]/mx*100)}%"></i></div>`)).join(""):"<p class='sub'>Select features or type a complaint to see suggestions.</p>"}
function tg(g){sel.has(g)?sel.delete(g):sel.add(g);document.querySelector(`[data-g=${g}]`).classList.toggle("on");assess()}
function qn(){const c=C[Math.random()*C.length|0];let o=[c];while(o.length<4){const d=C[Math.random()*C.length|0];if(!o.includes(d))o.push(d)}o.sort(()=>Math.random()-.5);qs.q={c,o}}
function ans(i){const q=qs.q;if(q.d)return;q.d=1;qs.n++;if(q.o[i]==q.c)qs.s++;show()}
function learn(){if(!qs.q)qn();const q=qs.q;return`<h2>Quiz: name the condition</h2><p>${q.c[7]} ${q.c[3].split(" ").slice(0,4).join(", ")}.</p>${q.o.map((o,i)=>`<button class="chip opt ${q.d?(o==q.c?"ok":"no"):""}" ${q.d&&o!=q.c?"":""} onclick="ans(${i})">${o[0]}</button>`).join("")}${q.d?`<p>${q.c[6]}</p><button class="btn pri" onclick="qn();show()">Next question</button>`:""}<p class="sub">Score ${qs.s} / ${qs.n}</p><h2>Where is the lesion? Visual pathway</h2><table>${LS.map(l=>`<tr><td><b>${l[0]}</b></td><td>${l[1]}</td></tr>`).join("")}</table><h2>Bedside approach</h2><details open><summary>Red or painful eye</summary><p>Check acuity, pupils and fluorescein. Pain, photophobia and reduced vision point to keratitis, uveitis or angle closure rather than conjunctivitis.</p></details><details><summary>Sudden visual loss</summary><p>Ask monocular vs binocular, painless vs painful. Examine pupils (afferent defect), fundus and fields. Think of giant cell arteritis over age 50.</p></details><details><summary>Double vision</summary><p>Cover one eye: if it persists, it is monocular (eye cause). If it resolves, it is binocular: check motility, cover test, pupils, ptosis.</p></details><details><summary>Pupil rules</summary><p>Anisocoria worse in light means the larger pupil is abnormal (CN III, Adie, drugs). Worse in dim light means the smaller pupil is abnormal (Horner).</p></details>`}
function img(){const ks=Object.keys(FU),fk=Object.keys(FD);const f=x=>fl=="All"||fl==x;return`<select onchange="fl=this.value;show()" aria-label="Filter">${["All","Fundus","Visual fields"].map(x=>`<option ${x==fl?"selected":""}>${x}</option>`).join("")}</select><p class="sub">Schematic redrawings keyed to the chapter’s figures. Original photographs are not reproduced.</p><div class="grid">${f("Fundus")?ks.map(k=>`<div class="card">${fu(k)}<b>${FU[k][0]}</b>${FU[k][1]}</div>`).join(""):""}${f("Visual fields")?fk.map(k=>`<div class="card">${FD[k][3]}<b>${FD[k][0]}</b>${FD[k][1]} · ${FD[k][2]}</div>`).join(""):""}</div>`}
function cond(){const cats=["All",...new Set(C.map(c=>c[1]))];return`<input id="q" placeholder="Search conditions" oninput="lst()"><select id="ct" onchange="lst()" style="margin-top:8px">${cats.map(c=>`<option>${c}</option>`).join("")}</select><div id="ls"></div>`}
function lst(){const q=$("q").value.toLowerCase(),c=$("ct").value;$("ls").innerHTML=C.filter(x=>(c=="All"||x[1]==c)&&(x.join(" ").toLowerCase().includes(q))).map(x=>det(x)).join("")}
function show(){nav();const v=$("v");if(tab=="assess"){v.innerHTML=`<textarea id="tx" rows="3" placeholder="Type the complaint or suspected condition, e.g. sudden painless vision loss in one eye" oninput="assess()"></textarea><div class="chips">${CH.map(c=>`<button class="chip ${sel.has(c[0])?"on":""}" data-g="${c[0]}" onclick="tg('${c[0]}')">${c[1]}</button>`).join("")}</div><div id="res"></div>`;assess()}else if(tab=="cond"){v.innerHTML=cond();lst()}else v.innerHTML=tab=="learn"?learn():img()}
show();
</script></body></html>
